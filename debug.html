<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #eee;
            font-family: sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        img,
        svg {
            width: 300px;
            height: 300px;
            border: 1px solid #ccc;
            background: white;
        }
    </style>
</head>

<body>
    <h2>Knight Logo - Flipped & Slashed Comparison</h2>
    <div class="container">
        <div class="card">
            <h3>Original Flipped (No slashes)</h3>
            <img src="logo_knight_right.svg" />
        </div>
        <div class="card">
            <h3>Flipped + Left Slashes</h3>
            <img src="logo_knight_right_slashed.svg" />
        </div>
    </div>
</body>

</html>
