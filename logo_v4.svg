<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#FFFFFF" />
  
  <!-- "translate(512, 0) scale(-1, 1)" completely flips everything horizontally across the exact center (256, 256) -->
  <g fill="#000000" transform="translate(512, 0) scale(-1, 1)">
    
    <!-- Arch with cyber slashes -->
    <path d="
      M 100,442
      L 100,232
      A 156,156 0 0,1 412,232
      
      L 412,250
      L 360,280
      L 412,270

      L 412,310
      L 360,340
      L 412,330

      L 412,370
      L 360,400
      L 412,390
      
      L 412,442
      
      L 348,432
      L 348,208
      A 12,12 0 0,0 324,208
      
      L 324,248
      A 8,8 0 0,1 308,248
      
      L 308,184
      A 12,12 0 0,0 284,184
      
      L 284,248
      A 8,8 0 0,1 268,248
      
      L 268,168
      A 12,12 0 0,0 244,168
      
      L 244,248
      A 8,8 0 0,1 228,248
      
      L 228,184
      A 12,12 0 0,0 204,184
      
      L 204,248
      A 8,8 0 0,1 188,248
      
      L 188,208
      A 12,12 0 0,0 164,208

      L 164,432
      Z
    "/>

    <!-- Symmetric Horizontal Base slightly widened to accommodate the rightward shift safely -->
    <path d="M 186,416 L 326,416 L 326,432 L 186,432 Z" />

    <!-- Leaping Horse Body purely shifted visual-right by 6px to fix centering visually -->
    <g transform="translate(214, 416) rotate(-10) skewX(-20) translate(-220, -416)">
      <path d="
        M 194,416 
        L 318,416 
        L 302,400 
        
        L 300,366 
        L 288,366 
        
        L 290,330 
        L 278,330 
        
        L 278,300 
        
        L 272,278 
        L 252,296 
        
        Q 224,296 204,322 
        
        L 204,332 
        L 218,332 
        L 214,344 
        
        Q 262,380 214,416 
        
        L 194,416 
        Z
      "/>
    </g>
  </g>
</svg>
