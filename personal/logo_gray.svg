<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" fill="#808080">
  <title id="title">Gold surrounding line with lemon flesh and veined leaf</title>
  <desc id="desc">Centered gold outline with a centered gold T, cut lemon flesh, and a slim two-sided leaf rooted at 315°.</desc>

  <defs>
    <!--
      Processing order for the leaf system:
      1. Define the transparent vein on the unreflected 330° -> 360° arc,
         with a non-tapered radial cross-section at 330°.
      2. Define the leaf in the same unreflected orthogonal/radial plane.
      3. Convert both to curves centered on the r=198 arc.
      4. Reflect only the leaf system across the 330° tangent.
    -->
    <path id="leaf-vein-source"
          d="M432.5,357.9
             C435.5,352.8 438.1,347.4 440.3,341.9
             C442.6,336.5 444.5,330.9 446.1,325.2
             C447.7,319.5 449.0,313.8 450.1,308.0
             C451.1,302.2 451.9,296.4 452.5,290.6
             C453.1,284.9 453.4,279.1 453.7,273.3
             C453.9,267.5 454.0,261.8 454.0,256.0
             C454.0,261.8 453.6,267.5 452.8,273.2
             C452.1,278.9 450.9,284.6 449.5,290.1
             C448.1,295.7 446.4,301.1 444.5,306.5
             C442.5,311.9 440.4,317.1 438.0,322.3
             C435.7,327.4 433.2,332.4 430.6,337.4
             C428.0,342.4 425.2,347.3 422.5,352.1
             Z"/>
    <mask id="transparent-vein" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <!--
        Source transparent vein. The final geometric reflection is applied by
        the parent leaf-system group, after the source mask and source leaf match.
      -->
      <use href="#leaf-vein-source" fill="#000"/>
    </mask>

    <!--
      Lemon flesh:
      1. Define the whole rounded fan-shaped pulp first using only circular arcs.
      The outer flesh arc uses r=178 from the main logo center, leaving about
      11px to the existing ring inner edge r=189.
      Its angular range is about 186.64° -> 263.36° after intersecting with
      the inner flesh circle.
      Inner edge also uses a circle, sharing the lemon boundary center:
        C=(-54.3,566.3), r=319
        gamma(theta) = C + r(cos theta, -sin theta)
        theta: 24.74° -> 65.26° from B to A.
      The lemon boundary centerline is r=330, so the radial spacing is 11px,
      matching the outer flesh-to-ring-inner spacing 189 - 178.
    -->
    <path id="lemon-flesh-source"
          fill-rule="evenodd"
          d="M79.2,276.6
             A178,178 0 0,0 235.4,432.8
             A319,319 0 0,0 79.2,276.6
             Z
             M103.0,346.9
             A178,178 0 0,0 106.0,351.9
             L161.4,331.3
             A319,319 0 0,0 159.7,329.8
             Z
             M143.2,393.7
             A178,178 0 0,0 147.4,397.1
             L176.8,346.4
             A319,319 0 0,0 175.4,345.0
             Z
             M179.9,416.9
             A178,178 0 0,0 185.7,419.5
             L187.6,388.9
             A69.0,69.0 0 0,1 183.4,388.5
             Z"/>
    <path id="lemon-boundary-bottom-source"
          d="M256.0,463.0
             C252.1,452.1 247.6,440.9 242.5,429.6
             C237.4,418.4 231.8,407.1 225.7,396.2
             C219.6,385.2 213.0,374.6 205.8,364.7
             C198.7,354.7 191.1,345.4 183.1,337.1
             C191.1,345.4 198.7,353.6 205.8,361.8
             C213.0,370.1 219.6,378.5 225.7,387.2
             C231.8,395.9 237.4,404.9 242.5,414.5
             C247.6,424.0 252.1,434.1 256.0,445.0
             Z"/>
    <path id="lemon-boundary-left-source"
          d="M49.0,256.0
             C59.9,259.9 71.1,264.4 82.4,269.5
             C93.6,274.6 104.9,280.2 115.8,286.3
             C126.8,292.4 137.4,299.0 147.3,306.2
             C157.3,313.3 166.6,320.9 174.9,328.9
             C166.6,320.9 158.4,313.3 150.2,306.2
             C141.9,299.0 133.5,292.4 124.8,286.3
             C116.1,280.2 107.1,274.6 97.5,269.5
             C88.0,264.4 77.9,259.9 67.0,256.0
             Z"/>
  </defs>

  <!-- Unit-circle anchors centered on (256,256), outer r=207, inner r=189:
      30°  outer=(435.3,152.5)  inner=(419.7,161.5)
      375° middle r=198, reflected tip=(547.7,262.7)
      90°  outer=(256,49)       inner=(256,67)
      300°  outer=(359.5,435.3)  inner=(350.5,419.7)
      315°  middle r=198=(396.0,396.0)
      330°  middle r=198=(427.5,355.0), tangent=(0.5,-0.866)
      360°  outer=(463,256)      inner=(445,256)
  -->

  <!-- Keep the circular construction centered on the 512x512 image center. -->
  <g id="centered-logo" transform="translate(256 256) scale(0.86) translate(-256 -256)">

  <g>
    <!-- Upper narrowing: tip at 30°, widens into the ring at 90° -->
    <path d="M435.3,152.5 C394.8,92.2 326.4,49 256,49 L256,67 C317.4,67.6 382.2,108.6 435.3,152.5 Z"/>

    <!-- Main ring: 90° around (CCW long arc) to 300° -->
    <path d="M256,49 A207,207 0 1,0 359.5,435.3 L350.5,419.7 A189,189 0 1,1 256,67 Z"/>

    <!--
      Lower narrowing:
      The original 300° -> 360° taper is preserved by the same formula as the
      transparent source. The visible gold portion is 300° -> 330°; 330° -> 360°
      is converted to the reflected transparent vein instead of remaining gold.
    -->
    <path d="M435.3,359.5
             A207,207 0 0,1 359.5,435.3
             L350.5,419.7
             C360.0,414.2 369.3,408.3 378.3,401.8
             C387.4,395.3 396.1,388.3 404.4,380.5
             C412.6,372.7 420.4,364.2 427.5,355.0
             Z"/>

  </g>

  <!-- Serif T drawn as explicit vector geometry. -->
  <path id="letter-t"
        fill="#808080"
        d="M161.0,174.0
           C184.0,180.0 207.0,181.0 232.0,181.0
           L280.0,181.0
           C305.0,181.0 328.0,180.0 351.0,174.0
           C355.0,173.0 358.0,175.0 358.8,179.0
           L363.0,215.0
           C363.7,221.0 355.8,222.0 354.0,216.0
           C347.0,194.5 329.5,187.0 306.5,187.0
           C284.5,187.0 277.0,191.0 277.0,200.5
           L277.0,302.5
           C277.0,321.5 287.0,330.0 306.0,331.8
           C312.0,332.3 311.6,340.0 306.0,340.0
           L206.0,340.0
           C200.4,340.0 200.0,332.3 206.0,331.8
           C225.0,330.0 235.0,321.5 235.0,302.5
           L235.0,200.5
           C235.0,191.0 227.5,187.0 205.5,187.0
           C182.5,187.0 165.0,194.5 158.0,216.0
           C156.2,222.0 148.3,221.0 149.0,215.0
           L153.2,179.0
           C154.0,175.0 157.0,173.0 161.0,174.0
           Z"/>

  <use id="lemon-flesh" href="#lemon-flesh-source"/>

  <!--
    Lemon flesh cuts:
    The flesh angle range is divided into 10 parts from left to right.
    Full cuts are placed at 3/10 and 6/10. The final 4/10 block receives one
    outer half-length cut at its midpoint, 8/10, ending at the outer flesh edge.
    Each cut is an unfilled thin radial sector centered at (192,320) in the
    512x512 source coordinate frame, using the even-odd fill rule rather than
    a white overlay.
  -->

  <!--
    Lemon boundary only:
    This follows the same construction as the existing circular taper.
    The centerline circle has radius R=330 and its center is C=(-54.3,566.3),
    the lower-left solution that passes through the existing ring midline at
    unit-circle 180° and 270°.
    Each root cross-section is fixed to the existing ring edge intersections:
    180° uses outer r=207 and inner r=189; 270° does the same.
    From those exact intersections the half-width tapers to 0 with smoothstep(u),
    so the lemon boundary cannot float away from the surrounding arc.
  -->
  <g id="lemon-boundary">
    <use href="#lemon-boundary-bottom-source"/>
    <use href="#lemon-boundary-left-source"/>
  </g>

  <!--
    Veined leaf:
    Source leaf is drawn before reflection on the 315° -> 375° r=198 arc.
    Leaf edges: C(theta) +/- W(theta) * N(theta)
    W(theta) = 25 * (exp(-3.4 * x^2) - B) / (1 - B), B=exp(-3.4),
    x = 2 * (theta - 315°) / 60° - 1.
    The group transform below is the final 330° tangent reflection applied only
    to the leaf and its transparent vein.
  -->
  <g transform="matrix(-0.5 -0.866025404 -0.866025404 0.5 948.648563 547.702503)">
    <g mask="url(#transparent-vein)">
      <path d="M402.5,390.2
               C404.6,388.2 406.8,386.3 408.9,384.3
               C413.2,380.3 417.6,376.4 422.2,372.3
               C426.7,368.3 431.5,364.3 436.3,360.1
               C441.1,355.9 446.1,351.5 450.7,346.8
               C455.4,342.1 459.8,337.0 463.4,331.5
               C466.9,325.9 469.7,320.0 471.4,313.7
               C473.1,307.5 473.7,300.9 473.3,294.3
               C473.0,287.7 471.7,281.1 470.0,274.7
               C468.4,268.3 466.3,262.1 464.2,256.0
               C462.1,249.9 460.0,244.1 458.1,238.3
               C456.1,232.6 454.3,226.9 452.5,221.3
               C450.8,215.8 449.1,210.2 447.3,204.8
               C448.4,210.4 449.2,216.1 449.4,221.9
               C449.7,227.7 449.4,233.4 448.4,239.2
               C447.5,244.9 445.9,250.5 443.8,256.0
               C441.7,261.5 439.1,266.7 436.4,271.8
               C433.8,276.8 431.0,281.7 428.7,286.4
               C426.3,291.2 424.4,295.9 423.1,300.8
               C421.8,305.6 421.1,310.7 420.8,316.0
               C420.4,321.3 420.4,326.8 420.2,332.6
               C420.0,338.3 419.6,344.1 418.6,349.9
               C417.7,355.7 416.3,361.4 414.2,366.8
               C412.2,372.2 409.6,377.4 406.5,382.3
               C405.5,383.8 404.5,385.4 403.4,386.8
               Z"/>
    </g>
  </g>
  </g>
</svg>
