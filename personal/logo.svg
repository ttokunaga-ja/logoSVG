<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 512" role="img" aria-labelledby="title desc" fill="#c8962a">
  <title id="title">Gold surrounding line with veined leaf</title>
  <desc id="desc">Centered gold outline with a slim two-sided leaf rooted at 315° and a transparent vein that bends outward from a 330° tangent.</desc>

  <defs>
    <mask id="transparent-vein" maskUnits="userSpaceOnUse" x="0" y="0" width="580" height="512">
      <rect width="580" height="512" fill="#fff"/>
      <!--
        Color-to-transparency inversion of the 330° -> 360° source shape,
        reflected across the 330° outer-circle tangent.
        Reflection axis: point=(435.267,359.5), direction=(0.5,-0.866025).
      -->
      <g transform="matrix(-0.5 -0.866025404 -0.866025404 0.5 964.237021 556.702503)">
        <path fill="#000" d="M435.267,359.5
                 A207,207 0 0,0 463,256
                 L419.679,350.5
                 Z"/>
      </g>
    </mask>
  </defs>

  <!-- Unit-circle anchors centered on (256,256), outer r=207, inner r=189:
      30°  outer=(435.3,152.5)  inner=(419.7,161.5)
      375° outer=(455.9,202.4), reflected tip=(561.0,263.1)
      90°  outer=(256,49)       inner=(256,67)
      300°  outer=(359.5,435.3)  inner=(350.5,419.7)
      315°  middle r=198=(396.0,396.0)
      330°  middle r=198=(427.5,355.0), tangent=(0.5,-0.866)
      360°  outer=(463,256)      inner=(445,256)
  -->

  <g mask="url(#transparent-vein)">
    <!-- Upper narrowing: tip at 30°, widens into the ring at 90° -->
    <path d="M435.3,152.5 C394.8,92.2 326.4,49 256,49 L256,67 C317.4,67.6 382.2,108.6 435.3,152.5 Z"/>

    <!-- Main ring: 90° around (CCW long arc) to 300° -->
    <path d="M256,49 A207,207 0 1,0 359.5,435.3 L350.5,419.7 A189,189 0 1,1 256,67 Z"/>

    <!-- Lower narrowing: widens out of the ring at 300°, tip at 360° -->
    <path d="M463,256 C463,329 420,400 359.5,435.3 L350.5,419.7 C404,389 463,325 463,256 Z"/>

    <!--
      Veined leaf:
      root = center + 198 * (cos 315°, -sin 315°) = (396.0,396.0)
      tip  = reflection of center + 207 * (cos 375°, -sin 375°) across the
             330° tangent = (561.0,263.1)
      leaf width = gaussian(t) * root taper * tip taper, max 18px.
    -->
