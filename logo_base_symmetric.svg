<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 白背景。透明化する場合は削除してください -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <!--
    v18: Perfectly Symmetrical Negative Space Hand
    
    Center X = 256.
    Inner cavity width = 184 (from X=164 to X=348).
    5 fingers, 4 gaps.
    Finger width = 24. Gap width = 16.
    5*24 + 4*16 = 120 + 64 = 184.
    
    Finger coordinates:
    Middle: X=244 to 268 (Center=256)
    Index:  X=284 to 308
    Thumb(R): X=324 to 348
    Ring:   X=204 to 228
    Pinky(L): X=164 to 188
    
    Tips pointing down (larger Y):
    Middle tip: Y=356
    Index & Ring tips: Y=340
    Outer fingers tips: Y=316
    
    All valleys (webbing) perfectly aligned at Y=256.
    Smooth rounded tips and valleys using Arcs.
  -->
  <path fill="#000000" d="
    M 100,70
    L 100,280
    A 156,156 0 0,0 412,280
    L 412,70
    
    L 348,80
    L 348,304
    A 12,12 0 0,1 324,304
    
    L 324,264
    A 8,8 0 0,0 308,264
    
    L 308,328
    A 12,12 0 0,1 284,328
    
    L 284,264
    A 8,8 0 0,0 268,264
    
    L 268,344
    A 12,12 0 0,1 244,344
    
    L 244,264
    A 8,8 0 0,0 228,264
    
    L 228,328
    A 12,12 0 0,1 204,328
    
    L 204,264
    A 8,8 0 0,0 188,264
    
    L 188,304
    A 12,12 0 0,1 164,304

    L 164,80
    Z
  "/>
</svg>
